# Reviewed planning metadata for the QETLAB completion program.
#
# Source facts, current statuses, reasons, files, and call dependencies remain in
# qetlab_inventory.toml and PROVENANCE.toml. This policy records only the
# capability-led work-package structure and assigns each currently incomplete
# public row exactly once.
schema_version = 1

baseline_capabilities = [
    "checked_dimension_and_combinatorial_guards",
    "explicit_rng_contract",
    "reviewed_source_inventory",
    "sparse_and_densification_policy",
    "structured_certificate_and_unknown_semantics",
    "structured_numeric_predicates",
    "tested_product_analysis",
    "typed_square_map_representations",
    "validated_symmetric_extension_hierarchies",
    "validated_spectral_primitives",
    "verified_random_ppt_construction",
]

[[work_packages]]
id = "general_map_model"
order = 1
title = "General rectangular and two-sided map model"
summary = "Complete the package-owned operator-space and two-sided operator-sum model before extending channel wrappers or optimization routines."
architecture_only = true
prerequisite_capabilities = [
    "reviewed_source_inventory",
    "sparse_and_densification_policy",
    "typed_square_map_representations",
]
provides_capabilities = [
    "general_rectangular_operator_space_model",
    "hermiticity_preserving_map_diagnostics",
    "two_sided_operator_sum_model",
]
functions = []
internal_helpers = []

