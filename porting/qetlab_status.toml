# Reviewed status overlay consumed by scripts/build_upstream_inventory.jl.
#
# Add one table per reviewed function. Each entry must identify an existing
# inventory record by function_name, source_path, or both. Supported overrides:
# implementation_status, test_status, documentation_status, benchmark_status,
# license_provenance_status, proposed_julia_name, proposed_julia_signature,
# compatibility_alias, review_status, and review_notes.
#
# Example:
# [[functions]]
# function_name = "PartialTrace"
# source_path = "PartialTrace.m"
# implementation_status = "implemented"
# test_status = "analytic_and_differential_tests_pass"
# documentation_status = "documented"
# benchmark_status = "baseline_recorded"
# license_provenance_status = "verified"
# review_status = "manually_reviewed"
# review_notes = ["MATLAB optional-argument semantics checked at the pinned SHA."]

schema_version = 1

