name: Julia nightly compatibility

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-nightly:
    name: Julia nightly / Ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    env:
      JULIA_NUM_THREADS: "2"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Julia nightly
        uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3
        with:
          version: nightly
      - name: Cache Julia artifacts
        uses: julia-actions/cache@b7788abd52452d5bc033d69796e110d9906af4ab # v3.2.0
      - name: Show dependency and runtime status
        run: >-
          julia --startup-file=no --project=. -e
          'using Pkg, InteractiveUtils; Pkg.status(); versioninfo()'
      - name: Run package tests
        uses: julia-actions/julia-runtest@6e050c8013b833b1195105ff2fce9cd802f53271 # v1
