name: Optional backend integration

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/extensions.yml"
      - "ext/**"
      - "src/QuantumEntanglementTools.jl"
      - "src/entanglement/backend_interface.jl"
      - "test/extensions/**"
      - "Project.toml"
  pull_request:
    paths:
      - ".github/workflows/extensions.yml"
      - "ext/**"
      - "src/QuantumEntanglementTools.jl"
      - "src/entanglement/backend_interface.jl"
      - "test/extensions/**"
      - "Project.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: extensions-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  entanglement-detection:
    name: EntanglementDetection 0.2.2 / Julia ${{ matrix.julia-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            julia-version: "1.11"
          - os: ubuntu-latest
            julia-version: "1.12"
          - os: macos-latest
            julia-version: "1.11"
          - os: macos-latest
            julia-version: "1.12"
          - os: windows-latest
            julia-version: "1.11"
          - os: windows-latest
            julia-version: "1.12"
    env:
      JULIA_NUM_THREADS: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install Julia
        uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.julia-version }}
      - name: Cache Julia artifacts
        uses: julia-actions/cache@v3
      - name: Show environment
        run: >-
          julia --startup-file=no -e
          'using InteractiveUtils, LinearAlgebra; versioninfo();
          println(LinearAlgebra.BLAS.get_config())'
      - name: Instantiate isolated extension environment
        run: >-
          julia --startup-file=no
          --project=test/extensions/entanglement_detection -e
          'using Pkg; Pkg.develop(PackageSpec(path=pwd())); Pkg.instantiate()'
      - name: Run load-order and process-isolation tests
        run: >-
          julia --startup-file=no
          --project=test/extensions/entanglement_detection
          test/extensions/entanglement_detection/runtests.jl
