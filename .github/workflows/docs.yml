name: Documentation

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "src/**"
      - "Project.toml"
      - "README.md"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "src/**"
      - "Project.toml"
      - "README.md"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build docs on Julia ${{ matrix.julia-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        julia-version:
          - "1.10"
          - "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}
      - name: Cache Julia artifacts
        uses: julia-actions/cache@v2
      - name: Instantiate docs environment with local package
        run: >-
          julia --startup-file=no --project=docs -e
          'using Pkg; Pkg.develop(PackageSpec(path=pwd())); Pkg.instantiate()'
      - name: Build docs and run doctests
        run: julia --startup-file=no --project=docs docs/make.jl
      - name: Upload rendered site
        if: matrix.julia-version == '1'
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: docs/build
          if-no-files-found: error
          retention-days: 7
