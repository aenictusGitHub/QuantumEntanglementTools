name: Documentation

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "docs/**"
      - "tutorials/**"
      - "src/**"
      - "Project.toml"
      - "README.md"
      - "scripts/check_docs_math_compat.jl"
      - "scripts/check_optional_backend_docs.jl"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "tutorials/**"
      - "src/**"
      - "Project.toml"
      - "README.md"
      - "scripts/check_docs_math_compat.jl"
      - "scripts/check_optional_backend_docs.jl"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build docs on Julia ${{ matrix.julia-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        julia-version:
          - "1.10"
          - "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Julia
        uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3
        with:
          version: ${{ matrix.julia-version }}
      - name: Cache Julia artifacts
        uses: julia-actions/cache@a7bed9df697e5d7309d68afe7542a87621a8b6c8 # v3.3.0
      - name: Instantiate docs environment with local package
        run: >-
          julia --startup-file=no --project=docs -e
          'using Pkg; Pkg.develop(PackageSpec(path=pwd())); Pkg.instantiate()'
      - name: Validate code generator and emit Julia smoke program
        env:
          QET_GENERATOR_SMOKE: ${{ runner.temp }}/qet-generator-smoke
        run: |
          node --check docs/src/assets/qet_code_generator_core.js
          node --check docs/src/assets/qet_code_generator_ui.js
          node --check docs/test/code_generator_cases.js
          node docs/test/code_generator_node.js "$QET_GENERATOR_SMOKE"
      - name: Execute generated Julia examples
        env:
          QET_GENERATOR_SMOKE: ${{ runner.temp }}/qet-generator-smoke
        run: >-
          julia --startup-file=no --project=docs
          "$QET_GENERATOR_SMOKE/generated_smoke.jl"
      - name: Build docs and run doctests
        run: julia --startup-file=no --project=docs docs/make.jl
      - name: Check rendered generator assets
        run: |
          test -f docs/build/code_generator/index.html
          test -f docs/build/assets/qet_code_generator.css
          test -f docs/build/assets/qet_code_generator_core.js
          test -f docs/build/assets/qet_code_generator_ui.js
      - name: Record rendered-site provenance
        env:
          DOCS_REF: ${{ github.ref }}
          DOCS_SHA: ${{ github.sha }}
        run: |
          {
            echo "ref=$DOCS_REF"
            echo "commit=$DOCS_SHA"
            julia --startup-file=no -e 'println("julia=", VERSION)'
          } > docs/build/build-info.txt
      - name: Upload GitHub Pages artifact
        if: >-
          matrix.julia-version == '1' &&
          github.ref == 'refs/heads/main' &&
          github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/build
      - name: Upload rendered site
        if: matrix.julia-version == '1'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: documentation-${{ github.run_id }}-${{ github.run_attempt }}
          path: docs/build
          if-no-files-found: error
          retention-days: ${{ startsWith(github.ref, 'refs/tags/') && 90 || 7 }}

  deploy:
    name: Deploy documentation to GitHub Pages
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy rendered documentation
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
