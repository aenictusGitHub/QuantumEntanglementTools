name: Core tests

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Julia ${{ matrix.julia-version }} / ${{ matrix.os }} / ${{ matrix.threads }} thread(s)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            julia-version: "1.10"
            threads: "1"
          - os: ubuntu-latest
            julia-version: "1"
            threads: "1"
          - os: ubuntu-latest
            julia-version: "1"
            threads: "4"
          - os: macos-latest
            julia-version: "1.10"
            threads: "1"
          - os: macos-latest
            julia-version: "1"
            threads: "1"
          - os: windows-latest
            julia-version: "1.10"
            threads: "1"
          - os: windows-latest
            julia-version: "1"
            threads: "1"
    env:
      JULIA_NUM_THREADS: ${{ matrix.threads }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Julia
        uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3
        with:
          version: ${{ matrix.julia-version }}
      - name: Cache Julia artifacts
        uses: julia-actions/cache@b7788abd52452d5bc033d69796e110d9906af4ab # v3.2.0
      - name: Show environment
        run: julia --startup-file=no -e 'using InteractiveUtils, LinearAlgebra; versioninfo(); println(LinearAlgebra.BLAS.get_config())'
      - name: Run package tests
        uses: julia-actions/julia-runtest@6e050c8013b833b1195105ff2fce9cd802f53271 # v1
