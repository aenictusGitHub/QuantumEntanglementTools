name: Core tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Julia ${{ matrix.julia-version }} / ${{ matrix.os }} / ${{ matrix.threads }} thread(s)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            julia-version: "1.10"
            threads: "1"
          - os: ubuntu-latest
            julia-version: "1"
            threads: "1"
          - os: ubuntu-latest
            julia-version: "1"
            threads: "4"
          - os: macos-latest
            julia-version: "1"
            threads: "1"
          - os: windows-latest
            julia-version: "1"
            threads: "1"
    env:
      JULIA_NUM_THREADS: ${{ matrix.threads }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}
      - name: Cache Julia artifacts
        uses: julia-actions/cache@v2
      - name: Show environment
        run: julia --startup-file=no -e 'using InteractiveUtils, LinearAlgebra; versioninfo(); println(LinearAlgebra.BLAS.get_config())'
      - name: Run package tests
        uses: julia-actions/julia-runtest@v1
