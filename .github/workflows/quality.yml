name: Quality, provenance, oracle, and benchmark smoke

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  provenance:
    name: Inventory and public API consistency
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check out pinned QETLAB source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: nathanieljohnston/QETLAB
          ref: d8589610f00cff106537268dee2e2a1153f3a601
          path: dev/upstream/QETLAB
          persist-credentials: false
      - name: Install Julia
        uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3
        with:
          version: "1"
      - name: Cache Julia artifacts
        uses: julia-actions/cache@a45e8fa8be21c18a06b7177052533149e61e9b38 # v3
      - name: Instantiate core environment
        run: julia --startup-file=no --project=. -e 'using Pkg; Pkg.instantiate()'
      - name: Check release metadata and tag consistency
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            julia --startup-file=no --project=. scripts/check_release.jl
          elif grep -Eq '^date-released:' CITATION.cff; then
            julia --startup-file=no --project=. scripts/check_release.jl --release-candidate
          else
            julia --startup-file=no --project=. scripts/check_release.jl
          fi
      - name: Validate Citation File Format metadata
        uses: citation-file-format/cffconvert-github-action@4cf11baa70a673bfdf9dad0acc7ee33b3f4b6084 # 2.0.0
        with:
          args: "--validate"
      - name: Check generated upstream inventory
        run: julia --startup-file=no --project=. scripts/build_upstream_inventory.jl --check
      - name: Check strict terminal completion and generated artifacts
        run: julia --startup-file=no --project=. scripts/check_qetlab_completion.jl --strict
      - name: Check exports, provenance, and reviewed mappings
        run: julia --startup-file=no --project=. scripts/check_public_api.jl
      - name: Reconcile generated claims without rerunning dedicated test jobs
        run: >-
          julia --startup-file=no --project=.
          scripts/reconcile_project_claims.jl --check --skip-tests
      - name: Cross-check matrix predicates independently
        run: julia --startup-file=no --project=. scripts/validate_matrix_predicates.jl

  aqua-jet-format:
    name: Aqua, representative JET, and formatting
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Julia
        uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3
        with:
          version: "1"
      - name: Cache Julia artifacts
        uses: julia-actions/cache@a45e8fa8be21c18a06b7177052533149e61e9b38 # v3
      - name: Instantiate quality environment with local package
        run: >-
          julia --startup-file=no --project=quality -e
          'using Pkg; Pkg.develop(PackageSpec(path=pwd())); Pkg.instantiate()'
      - name: Run Aqua and representative JET checks
        run: julia --startup-file=no --project=quality quality/run_quality.jl
      - name: Check Julia formatting without rewriting
        run: julia --startup-file=no --project=quality quality/format.jl

  committed-oracle:
    name: Source-free QETLAB oracle fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Julia
        uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3
        with:
          version: "1"
      - name: Cache Julia artifacts
        uses: julia-actions/cache@a45e8fa8be21c18a06b7177052533149e61e9b38 # v3
      - name: Instantiate oracle environment with local package
        run: >-
          julia --startup-file=no --project=test/oracle -e
          'using Pkg; Pkg.develop(PackageSpec(path=pwd())); Pkg.instantiate()'
      - name: Verify all committed fixtures and native/wrapper comparisons
        run: >-
          julia --startup-file=no --project=test/oracle
          test/oracle/runtests.jl

  benchmark-smoke:
    name: Quick benchmark smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JULIA_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Julia
        uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3
        with:
          version: "1"
      - name: Cache Julia artifacts
        uses: julia-actions/cache@a45e8fa8be21c18a06b7177052533149e61e9b38 # v3
      - name: Instantiate benchmark environment
        run: julia --startup-file=no --project=benchmark -e 'using Pkg; Pkg.instantiate()'
      - name: Run non-recording smoke suite
        run: >-
          julia --startup-file=no --project=benchmark
          benchmark/benchmarks.jl --quick --no-save
